<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071015"><meta name="description" content="NEON RIFT 3D Director’s Cut — атмосферный автономный 3D-шутер: 18 миров, 7 типов миссий, боссы и карта кампании.">
<title>NEON RIFT 3D — ROBOT FOUNDRY VI · FPS CONTROL</title>
<style>__NR_STYLE_0_INJECT__</style>

<style id="directors-cut-style">__NR_STYLE_1_INJECT__</style>
</head>
<body>
<canvas id="gl"></canvas><div id="scanlines"></div><div id="vignette"></div><div id="damageFlash"></div><div id="floatText"></div>
<div id="hud">
  <div class="hudtop"><div><div class="brandtiny">ECLIPSE PROTOCOL · SKYBRIDGE / SECTOR</div><div class="sector" id="sectorText">01 · ГРАНИЦА РАЗЛОМА</div><div id="zoneText" class="brandtiny" style="letter-spacing:.11em;color:#9bd7cf;font-size:9px;margin-top:2px">ЦИТАДЕЛЬ</div><div class="stats"><span id="killText">УНИЧТОЖЕНО 0 / 0</span><span id="scoreText">ОЧКИ 0000</span></div></div></div>
  <div id="fpsCorner" aria-label="Фактическая частота кадров"><span id="fpsMeter">— FPS</span></div>
  <div class="topright"><canvas id="minimap" width="192" height="192"></canvas><button id="fullscreenBtn" class="hudbutton" aria-label="Включить полноэкранный режим" title="Полный экран (G)" aria-pressed="false">⛶</button><button id="pauseBtn" class="hudbutton" aria-label="Пауза">Ⅱ</button></div>
  <div id="bossWrap"><div id="bossTitle">БЕЗЫМЯННЫЙ ХРАНИТЕЛЬ</div><div id="bossTrack"><div id="bossFill"></div></div></div>
  <div id="missionHUD" aria-live="off"><b>◈ МИССИЯ</b><span>Подготовка операции…</span></div><div id="navSignal">✦ НАЙДИ ПУТЬ ЧЕРЕЗ РАЗЛОМ</div><div id="radarLabel">КАРТА: ПРИБЛИЖЕНИЕ</div><div id="toast"></div><div id="combo"></div><div id="crosshair"></div><div id="altimeter" aria-live="off"></div><div id="eventLabel"></div><div id="reticleShield"></div><div id="combatBadge" aria-live="off"></div><div id="targetIntel"><div class="dcTargetTitle"></div><div class="dcTargetTrack"><div class="dcTargetFill"></div></div></div><div id="weaponBanner" aria-live="off"></div><div id="deviceHint" aria-live="off"></div>
  <div id="bars"><div class="barlabel"><span>КОРПУС</span><span id="hpLabel">100/100</span></div><div class="meter"><div id="hpFill" class="fill hp"></div></div><div class="barlabel"><span>ЭНЕРГИЯ</span><span id="energyLabel">100%</span></div><div class="meter"><div id="energyFill" class="fill en"></div></div><div class="barlabel"><span>БРОНЯ</span><span id="armorLabel">0/0</span></div><div class="meter"><div id="armorFill" class="fill arm"></div></div></div>
  <div id="weaponHud"><strong id="weaponName">⚡ ИМПУЛЬС</strong><span id="weaponStats">ПЕРЕГРЕВ 0% · 1/5</span></div>
  <div id="gun"><div id="gunbarrel"></div><div id="gunSight"></div><div id="gunGrip"></div><div id="gunRails"></div><div id="muzzle"></div></div>
  <div class="mobileUI"><div id="joystick"><div id="stick"></div></div><div id="touchActions"><button id="dashTouch" class="act"><b>➤</b>РЫВОК</button><button id="pulseTouch" class="act"><b>✺</b>ИМПУЛЬС</button><button id="shieldTouch" class="act"><b>⬡</b>БАРЬЕР</button><button id="healTouch" class="act"><b>✚</b>ЛЕЧЕНИЕ</button><button id="jumpTouch" class="act" aria-label="Прыжок"><b>⤒</b>ПРЫЖОК</button></div><button id="mobileSwitch">☷ АРСЕНАЛ</button></div><div id="weaponDrawer" role="group" aria-label="Выбор оружия"></div>
</div>
<div id="missionSplash" aria-hidden="true"><div class="dcIndex"></div><div class="dcTitle"></div><div class="dcSub"></div></div><div id="warningFrame"></div><div id="overlay"><div class="panel" id="panel"></div></div><div id="saveToast" aria-live="polite"></div>
<script>__NR_SCRIPT_0_INJECT__</script>
<script>__NR_SCRIPT_1_INJECT__</script>
</body>
</html>
